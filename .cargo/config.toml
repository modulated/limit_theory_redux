[term]
color = "always"

# Link Windows builds with rust-lld (LLVM's lld-link, shipped with the Rust
# toolchain) instead of MSVC's link.exe. It is much faster, above all for
# debug builds, and accepts the same MSVC-style arguments that
# engine/bin/ltr/build.rs passes (/MANIFEST:EMBED, /MANIFESTINPUT, /EXPORT).
# The MSVC build tools and Windows SDK are still needed for their libraries
# and for rc.exe (the app icon resource).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"

# Linux (x86_64) already links with rust-lld by default since Rust 1.90, and
# macOS uses Apple's ld, which is fast; neither needs an override.
