[package]
name = "luajit-ffi-gen"

version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
# Enable FFI wrapper functions call logging
log_ffi_calls = []
# Check FFI wrapper function input pointers for nil
assert_ffi_input = []

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
# external crates
proc-macro2.workspace = true
quote.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn.workspace = true

[dev-dependencies]
# The macro writes `::internal::...` into the code it generates, so a crate
# that uses it needs `internal` -- this crate only needs it to compile its own
# tests, which use the macro. As a plain dependency it is never referenced in
# this crate's source, and Cargo's unused_dependencies lint says so.
internal.workspace = true

libc = "0.2"
tracing = "0.1"
