[package]
name = "phx"
rust-version = "1.86"

version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
bench = true

[lints]
workspace = true

[features]
default = []
# Serve a live render-stats dashboard over HTTP (embedded tiny_http server,
# self-contained HTML page at /, JSON snapshot at /stats.json). Start with
# the ltr `--stats-server <port>` flag; inactive unless enabled.
stats-server = ["dep:tiny_http", "internal/stats-server"]

[dependencies]
# workspace crates
internal.workspace = true
luajit-ffi-gen.workspace = true

# external crates
arboard = "3.6"
chrono = "0.4"
cli-table = { version = "0.5", default-features = false }
crossbeam = "0.8"
directories = "6.0"
flate2 = "1.1"
gilrs = "0.11"
glam = { version = "0.29", features = ["scalar-math"] }
# Only the formats the game loads (res/ holds PNG and JPEG) and saves
# (screenshots and render-validation captures are PNG). The default formats
# include AVIF, which compiles the rav1e encoder, one of the slowest crates in
# the tree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "rayon"] }
indexmap = "2.14"
kira = { version = "0.9", features = ["symphonia", "cpal", "serde"] }
libc = "0.2"
mlua = { version = "0.10", features = ["luajit52", "vendored", "error-send"] }
notify = "8.2"
parley = { version = "0.13", default-features = false, features = ["std"] }
swash = "0.2"
rapier3d-f64 = { version = "0.22", features = ["simd-stable", "debug-render"] }
regex = "1.13"
# A fast non-cryptographic hasher for the render thread's per-draw lookups
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tiny_http = { version = "0.12", optional = true }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"
strum = "0.28"
strum_macros = "0.28"
tobj = "4.0"
byteorder = "1.5"
# NOTE: Cargo.lock pins gpu-allocator's `windows` dependency to 0.62 (the
# version wgpu-hal uses). gpu-allocator accepts 0.53..=0.62, so a
# `cargo update` touching the wgpu tree may re-resolve it to 0.54 (pulled in
# by cpal) and break wgpu-hal's DX12 build with ID3D12Device type mismatches.
# If that happens, re-point gpu-allocator's "windows" entry in Cargo.lock.
# Default features off: they add the GLES backend (glow, khronos-egl) and
# WebGPU, which the engine never selects (it requests Backends::PRIMARY). WGSL
# stays for the texture blit shader. Each native backend only compiles on its
# own OS.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
    "vulkan",
    "dx12",
    "glsl",
    "wgsl",
    "naga-ir",
] }
# Belt cull worker pool (render/instance_field.rs); already in Cargo.lock via other deps.
rayon = "1.10"

[dev-dependencies]
test-log = "0.2"
criterion = "0.8"

[[bench]]
name = "worker"
harness = false
