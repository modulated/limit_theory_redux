    { item = "Silicate Ore", weight = 0.45 },
    { item = "Iron Ore", weight = 0.28 },
    { item = "Carboniferous Ore", weight = 0.12 },
    { item = "Aluminum Ore", weight = 0.1 },
    { item = "Beryllium Ore", weight = 0.05 },
]

