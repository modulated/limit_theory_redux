# What the asteroids hold: the resources a star system's rocks yield.
#
# Loaded by script/Shared/Data/OreData.lua, which checks every entry and stops
# with "res/data/ores.toml:<line>: ..." on a mistake.
#
# A belt or a ring gets a composition from its star system's ruleset
# (script/Config/Gen/Rulesets/*.lua), which names one of the [composition.*]
# tables below by its key, for each type of field (rocky, icy). Each rock in
# the field is made of one ore, picked by weight from its seed, so the same
# rock always holds the same thing.
#
#   ores   the list, { item = "<item name>", weight = <relative chance> }.
#          Items are named exactly as in items.toml. Weights are relative:
#          they need not add up to 1.
#
# [fallback] is used for a field its ruleset gave no composition.

[fallback]
ores = [
    { item = "Silicate Ore", weight = 5 },
    { item = "Iron Ore", weight = 4 },
    { item = "Aluminum Ore", weight = 3 },
    { item = "Copper Ore", weight = 2 },
    # Carbonaceous chondrite: the commonest rock out there, and the carbon
    # feedstock the refineries want
    { item = "Carboniferous Ore", weight = 2.5 },
    { item = "Beryllium Ore", weight = 1 },
    { item = "Thorium Ore", weight = 0.3 },
]

# The small systems (one planet and its ring): the basic ores only
[composition.basic_rocky]
ores = [
    { item = "Silicate Ore", weight = 0.45 },
    { item = "Iron Ore", weight = 0.35 },
    { item = "Carboniferous Ore", weight = 0.1 },
    { item = "Aluminum Ore", weight = 0.1 },
]

