# The items of the game's economy: every good that can be mined, refined,
# made, bought, sold, carried or fitted.
#
# Loaded at start-up by script/Shared/Definitions/ItemDefs.lua, which checks
# every entry and stops with "res/data/items.toml:<line>: ..." on a mistake.
# The format is TOML (https://toml.io): one [[item]] block per item.
#
#   id              permanent number. Saved games record items by id, so an id
#                   is never changed or reused: a new item takes the next free
#                   one (see the end of this file), a removed item leaves its
#                   number unused.
#   name            what the game shows. Code reaches an item by the plain
#                   letters of its name ("Ship Engine, Thruster" ->
#                   ShipEngineThruster) and other data files name it as
#                   written here, so renaming an item means renaming it there
#                   too (the loader says where).
#   group           the item's category. Groups appear in the order their
#                   first item does. Code reaches items by group
#                   (Items.RawMaterials.IronOre), so a group is not renamed
#                   lightly either.
#   mass            tonnes per unit: what it costs in a hold or a hangar
#   energy_density  energy per tonne (energy = mass x energy_density)
#   price           the base price the markets start from and drift around
#                   (credits). Leave it out for an item nobody trades.
#
# Balancing: `luajit tools/economy-sim.lua --recipes` lists every recipe's
# margin at these prices; `luajit tools/data-check.lua` checks the files
# against each other.

