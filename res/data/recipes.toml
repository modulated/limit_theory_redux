# What stations (and the player's own lines) can make: the production chains.
#
# Loaded at start-up by script/Shared/Definitions/ProductionDefs.lua, which
# checks every entry and stops with "res/data/recipes.toml:<line>: ..." on a
# mistake. One [[recipe]] block per recipe.
#
#   id        permanent number. Stations and the player's lines record recipes
#             by id: never change or reuse one; a new recipe takes the next
#             free one (see the end of this file).
#   name      what the game shows
#   class     where it runs: "Powerplant", "Refinery", "Factory", "Drydock" or
#             "Misc". A station's trade and an outpost's specialisation are
#             classes.
#   duration  seconds for one run at Legacy's pace; the game divides it by
#             production.timeScale in GameConfig.lua
#   inputs    what one run takes:  { item = "<item name>", count = <units> }
#   outputs   what one run makes, the same way. Items are named exactly as in
#             items.toml.
#
# Balancing: `luajit tools/economy-sim.lua --recipes` prints each recipe's
# input cost, output value and margin at the items' base prices.

