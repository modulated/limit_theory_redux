# What a ship leaves behind when it is destroyed: the cargo canister that
# floats where it died. The player's ship pulls canisters in when it is close
# and loads them into the hold (Config.game.loot has the ranges and timings).
#
# Loaded by script/Shared/Data/LootData.lua, which checks every entry and
# stops with "res/data/loot.toml:<line>: ..." on a mistake.
#
# One [role.<name>] table per NPC role (Config.game.npc.roles in
# GameConfig.lua); a role with no table drops nothing. In it:
#
#   drops   the list of what may be in the canister, each rolled on its own:
#           { item = "<item name>", chance = <0..1>, min = <units>, max = <units> }
#           Items are named as in items.toml. `min`/`max` default to 1.
#           Modules and weapons are items like any other, so a wreck's guns
#           drop as the fitting items they are.
#
# The player's own drones and hires drop nothing.

[role.pirate]
drops = [
    { item = "Hull Scrap", chance = 0.9, min = 8, max = 20 },
    { item = "Salvaged Electronics", chance = 0.6, min = 2, max = 6 },
    { item = "Energy Cell", chance = 0.5, min = 10, max = 40 },
    { item = "Ship Weapon, Pulse Turret", chance = 0.12 },
    { item = "Ship Weapon, Launcher Turret", chance = 0.06 },
    { item = "Shield Capacitor", chance = 0.08 },
    { item = "Afterburner", chance = 0.04 },
    { item = "Radioactive Isotopes", chance = 0.1, min = 1, max = 3 },
]

[role.pirateScout]
drops = [
    { item = "Hull Scrap", chance = 0.9, min = 4, max = 10 },
    { item = "Salvaged Electronics", chance = 0.4, min = 1, max = 3 },
    { item = "Energy Cell", chance = 0.4, min = 5, max = 20 },
    { item = "Ship Weapon, Pulse Turret", chance = 0.08 },
    { item = "Manoeuvring Thrusters", chance = 0.04 },
]

